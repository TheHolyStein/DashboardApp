# Drop-in for caddy.service, installed to /etc/systemd/system/caddy.service.d/dashboard.conf.
# The Caddyfile binds to the Tailscale address, which only exists once tailscaled is up.
[Unit]
After=tailscaled.service network-online.target
Wants=tailscaled.service network-online.target

[Service]
Restart=on-failure
RestartSec=5
