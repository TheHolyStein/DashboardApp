# Installed by deploy/install.sh to /etc/ssh/sshd_config.d/60-dashboard.conf, and only when
# a sudo-capable user already has an authorized_keys entry (so nobody gets locked out).
# sshd uses the FIRST value it sees for a keyword; an earlier file (for example
# 50-cloud-init.conf) that sets PasswordAuthentication yes would win over this one.
PasswordAuthentication no
PermitRootLogin no
KbdInteractiveAuthentication no
